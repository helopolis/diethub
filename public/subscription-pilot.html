<script src="/hpds.js"></script>
<script>
let currentLang = 'ar';
let subData = null;

const STR = {
  ar: {
    loadError: 'تعذر التحميل — تحقق من الاتصال', retry: 'أعد المحاولة',
    noSub: 'لا يوجد اشتراك نشط', noSubBody: 'أنت حالياً على الفترة التجريبية أو بدون خطة مدفوعة',
    subscribeNow: 'اشترك الآن', currentPlan: 'خطتك الحالية', provider: 'مزود الدفع',
    status: 'الحالة', renewalType: 'نوع التجديد', autoRenewOn: 'التجديد التلقائي مفعّل',
    autoRenewOff: 'التجديد التلقائي غير مفعّل', autoRenewUnknown: 'حالة التجديد التلقائي غير معروفة',
    fixedDuration: 'مدة ثابتة — بدون تجديد تلقائي', expiresOn: 'ينتهي في', remainingDays: (n) => `${n} يوم متبقي`,
    manage: 'إدارة الاشتراك', renew: 'جدد الاشتراك',
    manageAppleBody: 'هذا الاشتراك عبر Apple App Store — يمكن إدارته أو إلغاؤه فقط من إعدادات جهاز iPhone الخاص بك (الإعدادات ← [اسمك] ← الاشتراكات).',
    manageGoogleBody: 'هذا الاشتراك عبر Google Play — يمكن إدارته أو إلغاؤه فقط من تطبيق Google Play على جهاز Android الخاص بك.',
    manageKashierBody: 'اشتراكك عبر الموقع له مدة ثابتة ولا يتجدد تلقائياً — جدده يدوياً قبل انتهائه لتجنب انقطاع الوصول.',
    history: 'سجل الفوترة', historyEmpty: 'لا يوجد سجل فوترة سابق',
    active: 'نشط', expired: 'منتهي', grace_period: 'فترة سماح', on_hold: 'معلّق', revoked: 'ملغى',
    apple: 'Apple App Store', google: 'Google Play', kashier: 'الموقع الإلكتروني (Kashier)',
  },
  en: {
    loadError: 'Could not load — check your connection', retry: 'Try again',
    noSub: 'No active subscription', noSubBody: "You're currently on the trial period or have no paid plan",
    subscribeNow: 'Subscribe Now', currentPlan: 'Current Plan', provider: 'Billing Provider',
    status: 'Status', renewalType: 'Renewal Type', autoRenewOn: 'Auto-renew is on',
    autoRenewOff: 'Auto-renew is off', autoRenewUnknown: 'Auto-renew status unknown',
    fixedDuration: 'Fixed duration — no automatic renewal', expiresOn: 'Expires on', remainingDays: (n) => `${n} day${n === 1 ? '' : 's'} left`,
    manage: 'Manage Subscription', renew: 'Renew Subscription',
    manageAppleBody: 'This subscription is billed through the Apple App Store — it can only be managed or cancelled from your iPhone Settings → [your name] → Subscriptions.',
    manageGoogleBody: 'This subscription is billed through Google Play — it can only be managed or cancelled from the Google Play app on your Android device.',
    manageKashierBody: "Your web subscription has a fixed duration and doesn't renew automatically — renew it manually before it ends to avoid losing access.",
    history: 'Billing History', historyEmpty: 'No past billing history',
    active: 'Active', expired: 'Expired', grace_period: 'Grace period', on_hold: 'On hold', revoked: 'Revoked',
    apple: 'Apple App Store', google: 'Google Play', kashier: 'Website (Kashier)',
  },
};
function tf(key, ...args) { const v = STR[currentLang][key]; return typeof v === 'function' ? v(...args) : v; }

function setLang(lang) {
  currentLang = lang;
  // hpdsApplyLangToDOM (hpds.js) is the shared helper that applies every
  // [data-ar]/[data-en] element on the page — including the sidebar nav and
  // topnav header, which have those attributes set but were never actually
  // being read, since this function set htmlRoot's lang/dir by hand instead
  // of calling the shared helper settings-pilot.html already uses for the
  // identical sidebar/topnav markup.
  hpdsApplyLangToDOM(lang);
  document.getElementById('btnAr').classList.toggle('active', lang==='ar');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  fetch('/diet/api/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lang }) });
  if (subData) render(subData);
}

function planLabel(plan) { return plan.charAt(0).toUpperCase() + plan.slice(1); }

function render(data) {
  subData = data;
  const root = document.getElementById('subRoot');
  const { current, history = [] } = data;

  if (!current) {
    root.innerHTML = `<div class="card" style="text-align:center;padding:32px 16px">
      <div style="font-size:15px;font-weight:700;color:var(--e-ink);margin-bottom:6px">${STR[currentLang].noSub}</div>
      <div style="font-size:13px;color:var(--e-ink-soft);margin-bottom:16px">${STR[currentLang].noSubBody}</div>
      <a class="modal-submit" style="display:inline-block;text-decoration:none;padding:12px 24px" href="/diet/payment">${STR[currentLang].subscribeNow}</a>
    </div>`;
    return;
  }

  const renewalText = current.renewalType === 'auto'
    ? (current.autoRenewing === true ? STR[currentLang].autoRenewOn : current.autoRenewing === false ? STR[currentLang].autoRenewOff : STR[currentLang].autoRenewUnknown)
    : STR[currentLang].fixedDuration;

  const noticeBody = current.provider === 'apple' ? STR[currentLang].manageAppleBody
    : current.provider === 'google' ? STR[currentLang].manageGoogleBody
    : STR[currentLang].manageKashierBody;

  const actionHTML = current.provider === 'kashier'
    ? `<a class="modal-submit" style="display:inline-block;text-decoration:none;padding:12px 24px;margin-top:12px" href="/diet/payment">${STR[currentLang].renew}</a>`
    : '';

  const expiresRow = current.endDate
    ? `<div class="sub-row"><span class="sub-row-label">${STR[currentLang].expiresOn}</span><span class="sub-row-value">${current.endDate} · ${tf('remainingDays', current.remainingDays)}</span></div>`
    : '';

  const historyRows = history.filter(h => !h.isCurrent);
  const historyHTML = historyRows.length === 0
    ? `<div style="font-size:13px;color:var(--e-ink-soft);text-align:center;padding:8px 0">${STR[currentLang].historyEmpty}</div>`
    : historyRows.map(h => `
      <div class="history-row">
        <div>
          <div class="history-plan">${planLabel(h.plan)} — ${STR[currentLang][h.provider] || h.provider}</div>
          <div class="history-meta">${h.startDate} → ${h.endDate || '—'}</div>
        </div>
        <div class="history-status">${STR[currentLang][h.status] || h.status}</div>
      </div>
    `).join('');

  root.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-bottom:10px">${STR[currentLang].currentPlan}</div>
      <div class="sub-plan-name">${planLabel(current.plan)}</div>
      <div class="sub-row"><span class="sub-row-label">${STR[currentLang].provider}</span><span class="sub-row-value">${STR[currentLang][current.provider] || current.provider}</span></div>
      <div class="sub-row"><span class="sub-row-label">${STR[currentLang].status}</span><span class="sub-row-value">${STR[currentLang][current.status] || current.status}</span></div>
      <div class="sub-row"><span class="sub-row-label">${STR[currentLang].renewalType}</span><span class="sub-row-value">${renewalText}</span></div>
      ${expiresRow}
      <div class="notice-box">${noticeBody}</div>
      ${actionHTML}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="section-title" style="margin-bottom:10px">${STR[currentLang].history}</div>
      ${historyHTML}
    </div>
  `;
}

async function loadSubscription() {
  try {
    const res = await fetch('/diet/api/subscription');
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById('subRoot').innerHTML = hpdsErrorStateHTML({ message: STR[currentLang].loadError, retryLabel: STR[currentLang].retry, onRetryFn: 'loadSubscription' });
  }
}

(async function init() {
  const meRes = await fetch('/diet/api/me');
  if (!meRes.ok || meRes.redirected) { location.href = '/diet/login'; return; }
  const me = await meRes.json();
  document.getElementById('avatarInitial').textContent = (me.username || '?')[0]?.toUpperCase() || '?';
  currentLang = me.lang || 'ar';
  setLang(currentLang);
  await loadSubscription();
})();
</script>
