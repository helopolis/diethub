<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DietHub — تفعيل البريد الإلكتروني</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--lime:#C8F560;--orange:#FF7A3D;--green:#2D6A4F;--dark:#1A1A2E}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.3;pointer-events:none}
.blob-1{width:300px;height:300px;background:var(--orange);top:-50px;right:-50px}
.blob-2{width:280px;height:280px;background:var(--lime);bottom:-50px;left:-50px}
.card{position:relative;z-index:10;background:rgba(255,255,255,0.07);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.15);border-radius:28px;padding:40px 32px;width:100%;max-width:480px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,0.4)}
.icon{width:80px;height:80px;background:linear-gradient(135deg,var(--lime),var(--orange));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 20px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,245,96,0.4)}50%{box-shadow:0 0 0 20px rgba(200,245,96,0)}}
h1{font-family:'Playfair Display',serif;color:#fff;font-size:1.6rem;margin-bottom:12px}
p{color:rgba(255,255,255,0.7);line-height:1.6;font-size:0.9rem;margin-bottom:20px}
.email-box{background:rgba(200,245,96,0.1);border:1px solid rgba(200,245,96,0.3);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:0.88rem;color:var(--lime)}
.steps{text-align:right;background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;margin:16px 0}
.step{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:0.85rem;color:rgba(255,255,255,0.7)}
.step-num{width:24px;height:24px;background:rgba(200,245,96,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:var(--lime);flex-shrink:0}
.btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;transition:all 0.2s;margin-bottom:10px}
.btn-primary{background:linear-gradient(135deg,var(--lime),#A8E063);color:var(--dark)}
.btn-secondary{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.15)}
.btn:hover{transform:translateY(-2px)}
.input-email{width:100%;padding:11px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:11px;color:#fff;font-size:0.88rem;font-family:'Cairo',sans-serif;outline:none;margin-bottom:10px}
.msg{padding:10px;border-radius:10px;font-size:0.82rem;margin-bottom:10px;display:none}
.msg-ok{background:rgba(200,245,96,0.15);border:1px solid rgba(200,245,96,0.3);color:var(--lime)}
.msg-err{background:rgba(255,87,87,0.15);border:1px solid rgba(255,87,87,0.3);color:#ff8a8a}
.divider{color:rgba(255,255,255,0.3);font-size:0.78rem;margin:12px 0}
@media(max-width:360px){.card{padding:28px 20px}}
.lang-toggle{position:fixed;top:16px;left:16px;z-index:999;display:flex;gap:4px;background:rgba(255,255,255,0.08);border-radius:20px;padding:3px;backdrop-filter:blur(10px)}
.lang-btn{padding:5px 14px;border:none;border-radius:16px;font-family:'Cairo',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;background:none;color:rgba(255,255,255,0.6);transition:all 0.2s}
.lang-btn.active{background:#C8F560;color:#1A1A2E}
</style>
<script defer src="https://analytics.talabatito.com/script.js" data-website-id="4ed211ee-9096-49e6-a619-0bbca563db5b"></script>
</head>
<body>
<div class="lang-toggle">
  <button class="lang-btn active" id="lBtnAr" onclick="setPageLang('ar')">عربي</button>
  <button class="lang-btn" id="lBtnEn" onclick="setPageLang('en')">EN</button>
</div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="card">
  <div class="icon">📧</div>
  <h1 id="pgTitle">تحقق من بريدك الإلكتروني</h1>
  <p id="pgDesc">أرسلنا لك رابط تفعيل. يرجى فتح بريدك الإلكتروني والضغط على الرابط لتفعيل حسابك.</p>

  <div class="steps">
    <div class="step"><div class="step-num">1</div><span id="step1">افتح بريدك الإلكتروني</span></div>
    <div class="step"><div class="step-num">2</div><span id="step2">ابحث عن رسالة من DietHub</span></div>
    <div class="step"><div class="step-num">3</div><span id="step3">اضغط على "تفعيل الحساب"</span></div>
    <div class="step"><div class="step-num">4</div><span id="step4">ستعود تلقائياً للوحة التحكم</span></div>
  </div>

  <div class="divider" id="resendDivider">لم تصلك الرسالة؟</div>
  <div class="msg msg-ok" id="resendOk">✅ تم إرسال رسالة تفعيل جديدة!</div>
  <div class="msg msg-err" id="resendErr"></div>
  <input class="input-email" type="email" id="resendEmail" placeholder="أدخل بريدك الإلكتروني">
  <button class="btn btn-primary" id="resendBtn" onclick="resend()">إعادة إرسال رابط التفعيل 📧</button>
  <button class="btn btn-secondary" id="logoutBtn" onclick="location.href='/diet/logout'">تسجيل خروج وتسجيل حساب جديد</button>
</div>
<script>
const STRINGS={
  ar:{title:'تحقق من بريدك الإلكتروني',desc:'أرسلنا لك رابط تفعيل. يرجى فتح بريدك الإلكتروني والضغط على الرابط لتفعيل حسابك.',step1:'افتح بريدك الإلكتروني',step2:'ابحث عن رسالة من DietHub',step3:'اضغط على "تفعيل الحساب"',step4:'ستعود تلقائياً للوحة التحكم',resendDivider:'لم تصلك الرسالة؟',resendOk:'✅ تم إرسال رسالة تفعيل جديدة!',emailPlaceholder:'أدخل بريدك الإلكتروني',resendBtn:'إعادة إرسال رابط التفعيل 📧',logoutBtn:'تسجيل خروج وتسجيل حساب جديد',emptyEmail:'يرجى إدخال البريد الإلكتروني',genericErr:'حدث خطأ'},
  en:{title:'Check Your Email',desc:'We sent you a verification link. Check your email and click the link to activate your account.',step1:'Open your email',step2:'Look for a message from DietHub',step3:'Click "Verify Account"',step4:'You\'ll return to the dashboard automatically',resendDivider:'Didn\'t receive it?',resendOk:'✅ New verification email sent!',emailPlaceholder:'Enter your email',resendBtn:'Resend Verification Link 📧',logoutBtn:'Log Out and Register a New Account',emptyEmail:'Please enter your email address',genericErr:'An error occurred'}
};
let _pageLang='ar';
function setPageLang(lang){
  const s=STRINGS[lang];const isAr=lang==='ar';_pageLang=lang;
  document.querySelector('html').setAttribute('lang',lang);document.querySelector('html').setAttribute('dir',isAr?'rtl':'ltr');
  document.getElementById('lBtnAr').classList.toggle('active',isAr);document.getElementById('lBtnEn').classList.toggle('active',!isAr);
  document.getElementById('pgTitle').textContent=s.title;
  document.getElementById('pgDesc').textContent=s.desc;
  document.getElementById('step1').textContent=s.step1;
  document.getElementById('step2').textContent=s.step2;
  document.getElementById('step3').textContent=s.step3;
  document.getElementById('step4').textContent=s.step4;
  document.getElementById('resendDivider').textContent=s.resendDivider;
  document.getElementById('resendOk').textContent=s.resendOk;
  document.getElementById('resendEmail').placeholder=s.emailPlaceholder;
  document.getElementById('resendBtn').textContent=s.resendBtn;
  document.getElementById('logoutBtn').textContent=s.logoutBtn;
}
window.setPageLang=setPageLang;
async function resend() {
  const email = document.getElementById('resendEmail').value.trim();
  const s = STRINGS[_pageLang];
  if (!email) { show('resendErr', s.emptyEmail); return; }
  const r = await fetch('/diet/resend-verification', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email}) });
  const d = await r.json();
  if (d.ok) show('resendOk');
  else show('resendErr', d.error || s.genericErr);
}
function show(id, msg) {
  document.getElementById('resendOk').style.display = 'none';
  document.getElementById('resendErr').style.display = 'none';
  const el = document.getElementById(id);
  if (msg) el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display='none', 5000);
}
(function(){
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  setPageLang(urlLang === 'en' ? 'en' : 'ar');
})();
</script>

<!-- Universal Back Button -->
<button id="dhBackBtn" onclick="dhGoBack()" title="رجوع" style="
  display:none;position:fixed;bottom:24px;left:24px;z-index:9999;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:var(--green,#2D6A4F);box-shadow:0 4px 16px rgba(45,106,79,0.35);
  align-items:center;justify-content:center;transition:transform 0.18s,box-shadow 0.18s;
" aria-label="رجوع">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
    stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
</button>
<script>
(function(){
  var btn = document.getElementById('dhBackBtn');
  var onDash = document.getElementById('p-home') !== null; // dashboard has panels

  function show(){ btn.style.display='flex'; }
  function hide(){ btn.style.display='none'; }

  function dhGoBack(){
    if(onDash){
      // If on a non-home tab, go back to home tab
      var active = document.querySelector('.tab.active');
      var panels = document.querySelectorAll('.panel');
      var tabs   = document.querySelectorAll('.tab');
      // Find home tab (first tab)
      var homePanel = document.getElementById('p-home');
      if(homePanel && !homePanel.classList.contains('active')){
        // Switch to home tab
        tabs.forEach(function(t){ t.classList.remove('active'); });
        panels.forEach(function(p){ p.classList.remove('active'); });
        if(tabs[0]) tabs[0].classList.add('active');
        if(homePanel) homePanel.classList.add('active');
        return;
      }
    }
    if(history.length > 1){ history.back(); }
  }

  window.dhGoBack = dhGoBack;

  // Show button logic
  if(onDash){
    // Watch tab switches
    document.addEventListener('click', function(e){
      var tab = e.target.closest('.tab');
      if(!tab) return;
      setTimeout(function(){
        var homePanel = document.getElementById('p-home');
        if(homePanel && homePanel.classList.contains('active')){
          hide();
        } else {
          show();
        }
      }, 50);
    });
    hide(); // start hidden on home
  } else {
    // Non-dashboard pages: always show if can go back
    if(history.length > 1){ show(); }
  }

  // Hover effect
  btn.addEventListener('mouseenter', function(){
    btn.style.transform='scale(1.12)';
    btn.style.boxShadow='0 6px 22px rgba(45,106,79,0.45)';
  });
  btn.addEventListener('mouseleave', function(){
    btn.style.transform='scale(1)';
    btn.style.boxShadow='0 4px 16px rgba(45,106,79,0.35)';
  });
})();
</script>

</body>
</html>
