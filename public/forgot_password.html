<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نسيت كلمة المرور | DietHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo",sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(200,245,96,0.2);border-radius:24px;padding:48px 40px;width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#C8F560,#A8E063);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#aaa;font-size:0.9rem;margin-top:8px}
label{display:block;color:#C8F560;font-size:0.85rem;font-weight:600;margin-bottom:8px}
input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#fff;font-size:1rem;font-family:"Cairo",sans-serif;outline:none;transition:border 0.2s}
input:focus{border-color:#C8F560}
input::placeholder{color:#666}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#C8F560,#A8E063);color:#1A1A2E;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:"Cairo",sans-serif;cursor:pointer;margin-top:24px;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:0.9rem;text-align:center;display:none}
.msg.success{background:rgba(200,245,96,0.1);border:1px solid #C8F560;color:#C8F560}
.msg.error{background:rgba(255,80,80,0.1);border:1px solid #ff5050;color:#ff8080}
.back{text-align:center;margin-top:24px}
.back a{color:#aaa;text-decoration:none;font-size:0.9rem;transition:color 0.2s}
.back a:hover{color:#C8F560}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>DietHub</h1>
    <p>إعادة تعيين كلمة المرور</p>
  </div>
  <div>
    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
    <button class="btn" id="btn" onclick="submit()">إرسال رابط الاستعادة</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="back"><a href="/diet/login">العودة لتسجيل الدخول</a></div>
</div>
<script>
async function submit() {
  const email = document.getElementById("email").value.trim();
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  if (!email) { showMsg("error","الرجاء إدخال البريد الإلكتروني"); return; }
  btn.disabled = true;
  btn.textContent = "جاري الإرسال...";
  try {
    const r = await fetch("/diet/api/forgot-password", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (r.ok) {
      showMsg("success","تم الإرسال! تحقق من بريدك الإلكتروني خلال دقائق. إذا كان البريد مسجلاً سيصلك رابط الاستعادة.");
      btn.textContent = "تم الإرسال";
    } else {
      showMsg("error", d.error || "حدث خطأ");
      btn.disabled = false; btn.textContent = "إرسال رابط الاستعادة";
    }
  } catch(e) { showMsg("error","خطأ في الاتصال"); btn.disabled=false; btn.textContent="إرسال رابط الاستعادة"; }
}
function showMsg(type, text) {
  const m = document.getElementById("msg");
  m.className = "msg " + type;
  m.style.display = "block";
  m.textContent = text;
}
document.getElementById("email").addEventListener("keydown", e => { if(e.key==="Enter") submit(); });
</script>

<!-- Universal Back Button -->
<button id="dhBackBtn" onclick="dhGoBack()" title="رجوع" style="
  display:none;position:fixed;bottom:24px;left:24px;z-index:9999;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:var(--green,#2D6A4F);box-shadow:0 4px 16px rgba(45,106,79,0.35);
  align-items:center;justify-content:center;transition:transform 0.18s,box-shadow 0.18s;
" aria-label="رجوع">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
    stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
</button>
<script>
(function(){
  var btn = document.getElementById('dhBackBtn');
  var onDash = document.getElementById('p-home') !== null; // dashboard has panels

  function show(){ btn.style.display='flex'; }
  function hide(){ btn.style.display='none'; }

  function dhGoBack(){
    if(onDash){
      // If on a non-home tab, go back to home tab
      var active = document.querySelector('.tab.active');
      var panels = document.querySelectorAll('.panel');
      var tabs   = document.querySelectorAll('.tab');
      // Find home tab (first tab)
      var homePanel = document.getElementById('p-home');
      if(homePanel && !homePanel.classList.contains('active')){
        // Switch to home tab
        tabs.forEach(function(t){ t.classList.remove('active'); });
        panels.forEach(function(p){ p.classList.remove('active'); });
        if(tabs[0]) tabs[0].classList.add('active');
        if(homePanel) homePanel.classList.add('active');
        return;
      }
    }
    if(history.length > 1){ history.back(); }
  }

  window.dhGoBack = dhGoBack;

  // Show button logic
  if(onDash){
    // Watch tab switches
    document.addEventListener('click', function(e){
      var tab = e.target.closest('.tab');
      if(!tab) return;
      setTimeout(function(){
        var homePanel = document.getElementById('p-home');
        if(homePanel && homePanel.classList.contains('active')){
          hide();
        } else {
          show();
        }
      }, 50);
    });
    hide(); // start hidden on home
  } else {
    // Non-dashboard pages: always show if can go back
    if(history.length > 1){ show(); }
  }

  // Hover effect
  btn.addEventListener('mouseenter', function(){
    btn.style.transform='scale(1.12)';
    btn.style.boxShadow='0 6px 22px rgba(45,106,79,0.45)';
  });
  btn.addEventListener('mouseleave', function(){
    btn.style.transform='scale(1)';
    btn.style.boxShadow='0 4px 16px rgba(45,106,79,0.35)';
  });
})();
</script>

</body>
</html>
