<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة مرور جديدة | DietHub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Cairo",sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(200,245,96,0.2);border-radius:24px;padding:48px 40px;width:100%;max-width:420px}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#C8F560,#A8E063);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:#aaa;font-size:0.9rem;margin-top:8px}
label{display:block;color:#C8F560;font-size:0.85rem;font-weight:600;margin-bottom:8px;margin-top:20px}
input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:#fff;font-size:1rem;font-family:"Cairo",sans-serif;outline:none;transition:border 0.2s}
input:focus{border-color:#C8F560}
.hint{color:#888;font-size:0.78rem;margin-top:6px;line-height:1.5}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#C8F560,#A8E063);color:#1A1A2E;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:"Cairo",sans-serif;cursor:pointer;margin-top:24px;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{margin-top:16px;padding:14px;border-radius:10px;font-size:0.9rem;text-align:center;display:none}
.msg.success{background:rgba(200,245,96,0.1);border:1px solid #C8F560;color:#C8F560}
.msg.error{background:rgba(255,80,80,0.1);border:1px solid #ff5050;color:#ff8080}
.invalid{border-color:#ff5050!important}
@media(max-width:360px){.card{padding:28px 20px}}
.lang-toggle{position:fixed;top:16px;left:16px;z-index:999;display:flex;gap:4px;background:rgba(255,255,255,0.08);border-radius:20px;padding:3px;backdrop-filter:blur(10px)}
.lang-btn{padding:5px 14px;border:none;border-radius:16px;font-family:'Cairo',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;background:none;color:rgba(255,255,255,0.6);transition:all 0.2s}
.lang-btn.active{background:#C8F560;color:#1A1A2E}
</style>
<script defer src="https://analytics.talabatito.com/script.js" data-website-id="4ed211ee-9096-49e6-a619-0bbca563db5b"></script>
</head>
<body>
<div class="lang-toggle">
  <button class="lang-btn active" id="lBtnAr" onclick="setPageLang('ar')">عربي</button>
  <button class="lang-btn" id="lBtnEn" onclick="setPageLang('en')">EN</button>
</div>
<div class="card">
  <div class="logo">
    <h1>DietHub</h1>
    <p id="pgSubtitle">تعيين كلمة مرور جديدة</p>
  </div>
  <div id="formArea">
    <label for="pwd" id="pwdLabel">كلمة المرور الجديدة</label>
    <div style="position:relative">
      <input type="password" id="pwd" placeholder="كلمة المرور الجديدة" style="padding-left:44px">
      <button type="button" onclick="toggleEye('pwd','eye1')" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#aaa;display:flex;align-items:center">
        <svg id="eye1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="hint" id="pwdHintText">يجب أن تحتوي على: حرف كبير + حرف صغير + رقم + رمز (!@#$%)</div>
    <label for="pwd2" id="pwd2Label">تأكيد كلمة المرور</label>
    <div style="position:relative">
      <input type="password" id="pwd2" placeholder="أعد كتابة كلمة المرور" style="padding-left:44px">
      <button type="button" onclick="toggleEye('pwd2','eye2')" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#aaa;display:flex;align-items:center">
        <svg id="eye2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <button class="btn" id="btn" onclick="doReset()">تعيين كلمة المرور</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="successArea" style="display:none;text-align:center;padding:20px 0">
    <div style="font-size:3rem;margin-bottom:16px;color:#C8F560">✓</div>
    <p id="successTitle" style="color:#C8F560;font-size:1.1rem;font-weight:700;margin-bottom:8px">تم تغيير كلمة المرور بنجاح</p>
    <p id="successSub" style="color:#aaa;margin-bottom:24px">يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة</p>
    <a href="/diet/login" id="successLoginLink" style="display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#C8F560,#A8E063);color:#1A1A2E;border-radius:12px;text-decoration:none;font-weight:700">تسجيل الدخول</a>
  </div>
</div>
<script>
const STRINGS={
  ar:{subtitle:'تعيين كلمة مرور جديدة',pwdLabel:'كلمة المرور الجديدة',pwdPlaceholder:'كلمة المرور الجديدة',pwdHint:'يجب أن تحتوي على: حرف كبير + حرف صغير + رقم + رمز (!@#$%)',pwd2Label:'تأكيد كلمة المرور',pwd2Placeholder:'أعد كتابة كلمة المرور',submitBtn:'تعيين كلمة المرور',saving:'جاري الحفظ...',mismatch:'كلمتا المرور غير متطابقتين',genericErr:'حدث خطأ',connErr:'خطأ في الاتصال',invalidLink:'رابط غير صحيح أو منتهي الصلاحية',requestNew:'طلب رابط جديد',successTitle:'تم تغيير كلمة المرور بنجاح',successSub:'يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة',loginBtn:'تسجيل الدخول'},
  en:{subtitle:'Set a New Password',pwdLabel:'New Password',pwdPlaceholder:'New password',pwdHint:'Must contain: uppercase + lowercase + number + symbol (!@#$%)',pwd2Label:'Confirm Password',pwd2Placeholder:'Re-enter your password',submitBtn:'Set Password',saving:'Saving...',mismatch:'Passwords do not match',genericErr:'An error occurred',connErr:'Connection error',invalidLink:'Invalid or expired link',requestNew:'Request a new link',successTitle:'Password changed successfully',successSub:'You can now log in with your new password',loginBtn:'Login'}
};
let _pageLang='ar';
function setPageLang(lang){
  const s=STRINGS[lang];const isAr=lang==='ar';_pageLang=lang;
  document.querySelector('html').setAttribute('lang',lang);document.querySelector('html').setAttribute('dir',isAr?'rtl':'ltr');
  document.getElementById('lBtnAr').classList.toggle('active',isAr);document.getElementById('lBtnEn').classList.toggle('active',!isAr);
  document.getElementById('pgSubtitle').textContent=s.subtitle;
  document.getElementById('pwdLabel').textContent=s.pwdLabel;
  document.getElementById('pwd').placeholder=s.pwdPlaceholder;
  document.getElementById('pwdHintText').textContent=s.pwdHint;
  document.getElementById('pwd2Label').textContent=s.pwd2Label;
  document.getElementById('pwd2').placeholder=s.pwd2Placeholder;
  const btn=document.getElementById('btn');if(!btn.disabled)btn.textContent=s.submitBtn;
  document.getElementById('successTitle').textContent=s.successTitle;
  document.getElementById('successSub').textContent=s.successSub;
  document.getElementById('successLoginLink').textContent=s.loginBtn;
  const invalidMsg=document.getElementById('invalidLinkMsg');
  if(invalidMsg){invalidMsg.innerHTML=s.invalidLink+'<br><a href="/diet/forgot-password?lang='+lang+'" style="color:#C8F560">'+s.requestNew+'</a>';}
}
window.setPageLang=setPageLang;
const token = new URLSearchParams(location.search).get("token");
if (!token) {
  document.getElementById("formArea").innerHTML = "<p id=\"invalidLinkMsg\" style=\"color:#ff8080;text-align:center\"></p>";
}
async function doReset() {
  const pwd = document.getElementById("pwd").value;
  const pwd2 = document.getElementById("pwd2").value;
  const btn = document.getElementById("btn");
  const s = STRINGS[_pageLang];
  if (pwd !== pwd2) { showMsg("error", s.mismatch); document.getElementById("pwd2").classList.add("invalid"); return; }
  document.getElementById("pwd2").classList.remove("invalid");
  btn.disabled = true; btn.textContent = s.saving;
  try {
    const r = await fetch("/diet/api/reset-password", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ token, password: pwd })
    });
    const d = await r.json();
    if (r.ok) {
      document.getElementById("formArea").style.display = "none";
      document.getElementById("successArea").style.display = "block";
    } else {
      showMsg("error", d.error || s.genericErr);
      btn.disabled = false; btn.textContent = s.submitBtn;
    }
  } catch(e) { showMsg("error", s.connErr); btn.disabled=false; btn.textContent=s.submitBtn; }
}
function toggleEye(inputId, eyeId) {
  const input = document.getElementById(inputId);
  const eye = document.getElementById(eyeId);
  if (input.type === "password") {
    input.type = "text";
    eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    eye.setAttribute("stroke","#C8F560");
  } else {
    input.type = "password";
    eye.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    eye.setAttribute("stroke","currentColor");
  }
}
function showMsg(type, text) {
  const m = document.getElementById("msg");
  m.className = "msg " + type; m.style.display = "block"; m.textContent = text;
}
(function(){
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  setPageLang(urlLang === 'en' ? 'en' : 'ar');
})();
</script>

<!-- Universal Back Button -->
<button id="dhBackBtn" onclick="dhGoBack()" title="رجوع" style="
  display:none;position:fixed;bottom:24px;left:24px;z-index:9999;
  width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
  background:var(--green,#2D6A4F);box-shadow:0 4px 16px rgba(45,106,79,0.35);
  align-items:center;justify-content:center;transition:transform 0.18s,box-shadow 0.18s;
" aria-label="رجوع">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
    stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 18 9 12 15 6"/>
  </svg>
</button>
<script>
(function(){
  var btn = document.getElementById('dhBackBtn');
  var onDash = document.getElementById('p-home') !== null; // dashboard has panels

  function show(){ btn.style.display='flex'; }
  function hide(){ btn.style.display='none'; }

  function dhGoBack(){
    if(onDash){
      // If on a non-home tab, go back to home tab
      var active = document.querySelector('.tab.active');
      var panels = document.querySelectorAll('.panel');
      var tabs   = document.querySelectorAll('.tab');
      // Find home tab (first tab)
      var homePanel = document.getElementById('p-home');
      if(homePanel && !homePanel.classList.contains('active')){
        // Switch to home tab
        tabs.forEach(function(t){ t.classList.remove('active'); });
        panels.forEach(function(p){ p.classList.remove('active'); });
        if(tabs[0]) tabs[0].classList.add('active');
        if(homePanel) homePanel.classList.add('active');
        return;
      }
    }
    if(history.length > 1){ history.back(); }
  }

  window.dhGoBack = dhGoBack;

  // Show button logic
  if(onDash){
    // Watch tab switches
    document.addEventListener('click', function(e){
      var tab = e.target.closest('.tab');
      if(!tab) return;
      setTimeout(function(){
        var homePanel = document.getElementById('p-home');
        if(homePanel && homePanel.classList.contains('active')){
          hide();
        } else {
          show();
        }
      }, 50);
    });
    hide(); // start hidden on home
  } else {
    // Non-dashboard pages: always show if can go back
    if(history.length > 1){ show(); }
  }

  // Hover effect
  btn.addEventListener('mouseenter', function(){
    btn.style.transform='scale(1.12)';
    btn.style.boxShadow='0 6px 22px rgba(45,106,79,0.45)';
  });
  btn.addEventListener('mouseleave', function(){
    btn.style.transform='scale(1)';
    btn.style.boxShadow='0 4px 16px rgba(45,106,79,0.35)';
  });
})();
</script>

</body>
</html>
